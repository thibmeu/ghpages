name: Sync Standard.site

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
      - "layouts/index.standardsite.json"
      - "scripts/sync-standard-site.mjs"
      - "config.toml"
  workflow_dispatch:

concurrency:
  group: standard-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Publish eligible posts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.165.0"
          extended: true

      # A production build deliberately omits drafts and future-dated posts.
      - name: Build publishable-post catalog
        run: hugo --gc --minify

      - name: Sync Standard.site records
        env:
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_PASSWORD_APP }}
        run: node scripts/sync-standard-site.mjs
