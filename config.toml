baseurl = "https://thibmeu.com/"
title = "Thibault Meunier"
theme = "hugo-coder"
locale = "en"
defaultcontentlanguage = "en"

paginate = 20
canonifyurls = false
pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

[taxonomies]
  tag = "tags"

[mediaTypes."application/vnd.standard-site+json"]
  suffixes = ["json"]

[outputFormats.StandardSite]
  mediaType = "application/vnd.standard-site+json"
  baseName = "standard-site"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "StandardSite"]

[params]
    author = "Thibault Meunier"
    info = "I talk to computers to make them work"
    description = "Writing and projects about privacy, Internet protocols, and small pieces of software."
    keywords = "blog,developer,personal"
    customCSS = ["css/links.css"]
    customSCSS = ["scss/content.scss", "scss/home.scss"]
    manifest = "/manifest.webmanifest"
    standardSiteDID = "did:plc:axsoagliiwugidqvfa2vl6g3"
    standardSitePublication = "main"

    hidecredits = false
    hidecopyright = true

    colorScheme = "auto"
    hidecolorschemetoggle = false

    math = false

# Social links
[[params.social]]
    name = "Github"
    icon = "fa fa-github fa-2x"
    weight = 1
    url = "https://github.com/thibmeu/"
[[params.social]]
    name = "Bluesky"
    icon = "fa-brands fa-bluesky fa-2x"
    weight = 2
    url = "https://bsky.app/profile/thibmeu.com/"
[[params.social]]
    name = "RSS"
    icon = "fa fa-rss fa-2x"
    weight = 3
    url = "/index.xml"

# Menu links
[[menu.main]]
    name = "Blog"
    weight = 1
    url  = "posts/"

[[menu.main]]
    name = "Projects"
    weight = 2
    url  = "projects/"

[[menu.main]]
    name = "Work"
    weight = 3
    url  = "work/"

[[menu.main]]
    name = "Links"
    weight = 4
    url  = "links/"
