{{ define "title" }}{{ .Title }} · {{ .Site.Title }}{{ end }}
{{ define "content" }}
<section class="container page publish">
  <article>
    <header>
      <h1 class="title">{{ .Title }}</h1>
    </header>

    <form id="publish">
      <label for="url">URL</label>
      <input id="url" name="url" type="url" inputmode="url" required
             placeholder="https://" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit">Publish</button>
    </form>

    <p id="status" class="publish-status" role="status" aria-live="polite"></p>

    <details>
      <summary>Notifications</summary>
      <div>
        <p id="notify-state">Get commits and builds as system notifications.</p>
        <button id="notify-btn" type="button">Enable notifications</button>
      </div>
    </details>

    <details>
      <summary>Enrol this device</summary>
      <div>
        <label for="enrol">Enrolment secret</label>
        <input id="enrol" type="password" autocomplete="off">
        <button id="enrol-btn" type="button">Create passkey</button>
      </div>
    </details>
  </article>
</section>

<script>
const RP_ID = "thibault.uk";
const VAPID_PUBLIC = "BNi7RTi3DuGMsvM3HMJw57Pvbtdjqal6tv6xqI0X_qltKpq7VP97xvG-kWymrSYAShm0p4Zdc3AXsAxxd2e2rm4";

const $ = (id) => document.getElementById(id);
const status = $("status");

const say = (msg, cls = "") => { status.className = "publish-status " + cls; status.innerHTML = msg; };

const b64u = (buf) =>
  btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

const unb64u = (s) =>
  Uint8Array.from(
    atob(s.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(s.length / 4) * 4, "=")),
    (c) => c.charCodeAt(0)
  );

const challenge = async () => {
  const res = await fetch("/hooks/challenge");
  if (!res.ok) throw new Error("could not get a challenge");
  return new TextEncoder().encode(await res.text());
};

// One passkey assertion, reused by publishing and by subscribing to push.
const assert = async () => {
  const cred = await navigator.credentials.get({
    publicKey: {
      challenge: await challenge(),
      rpId: RP_ID,
      userVerification: "preferred",
    },
  });
  return {
    credentialId: b64u(cred.rawId),
    clientDataJSON: b64u(cred.response.clientDataJSON),
    authenticatorData: b64u(cred.response.authenticatorData),
    signature: b64u(cred.response.signature),
  };
};

const post = async (path, body) => {
  const res = await fetch(path, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res;
};

// Share targets are inconsistent: Android often drops the URL into `text`.
const params = new URLSearchParams(location.search);
const shared = params.get("url") || params.get("text") || "";
$("url").value = (shared.match(/https?:\/\/\S+/) || [shared])[0];

$("publish").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  const url = $("url").value.trim();
  btn.disabled = true;
  say("Waiting for passkey…");
  try {
    const assertion = await assert();
    say("Fetching page and tagging…");
    const res = await post("/hooks/publish", { url, ...assertion });
    const { title, tags } = await res.json();
    say(`Published <strong>${title}</strong>${tags.length ? ` — ${tags.join(", ")}` : ""}`, "ok");
    $("url").value = "";
  } catch (err) {
    say(err.message || String(err), "err");
  } finally {
    btn.disabled = false;
  }
});

$("enrol-btn").addEventListener("click", async () => {
  say("Creating passkey…");
  try {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: await challenge(),
        rp: { id: RP_ID, name: "thibault.uk" },
        // Stable user id so re-enrolling replaces the passkey instead of piling up.
        user: {
          id: new TextEncoder().encode("thibmeu"),
          name: "thibmeu",
          displayName: "Thibault Meunier",
        },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }], // ES256 only
        // Discoverable, so publishing never has to name a credential up front.
        authenticatorSelection: {
          residentKey: "required",
          userVerification: "preferred",
        },
      },
    });
    const publicKey = cred.response.getPublicKey();
    if (!publicKey) throw new Error("authenticator returned no ES256 key");
    await post("/hooks/passkey/register", {
      enrol: $("enrol").value,
      credentialId: b64u(cred.rawId),
      publicKey: b64u(publicKey),
      clientDataJSON: b64u(cred.response.clientDataJSON),
    });
    $("enrol").value = "";
    say("Device enrolled. You can publish now.", "ok");
  } catch (err) {
    say(err.message || String(err), "err");
  }
});

const notifyState = $("notify-state");
const notifyBtn = $("notify-btn");

const supported = "serviceWorker" in navigator && "PushManager" in window;
if (!supported) {
  notifyState.textContent = "This browser does not support Web Push.";
  notifyBtn.disabled = true;
} else if (Notification.permission === "denied") {
  notifyState.textContent = "Notifications are blocked in your browser settings.";
  notifyBtn.disabled = true;
} else {
  navigator.serviceWorker.register("/sw.js").then(async (reg) => {
    if (await reg.pushManager.getSubscription()) {
      notifyState.textContent = "Notifications are on for this device.";
      notifyBtn.textContent = "Re-subscribe";
    }
  }).catch(() => {});
}

notifyBtn.addEventListener("click", async () => {
  notifyBtn.disabled = true;
  say("Enabling notifications…");
  try {
    const reg = await navigator.serviceWorker.register("/sw.js");
    await navigator.serviceWorker.ready;

    // Must happen inside this click; browsers ignore permission requests otherwise.
    if (await Notification.requestPermission() !== "granted") {
      throw new Error("notification permission not granted");
    }

    // An existing subscription may predate the current VAPID key, so replace it.
    const existing = await reg.pushManager.getSubscription();
    if (existing) await existing.unsubscribe();

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: unb64u(VAPID_PUBLIC),
    });
    const { endpoint, keys } = sub.toJSON();

    say("Confirming with your passkey…");
    await post("/hooks/push/subscribe", {
      subscription: { endpoint, p256dh: keys.p256dh, auth: keys.auth },
      ...(await assert()),
    });

    notifyState.textContent = "Notifications are on for this device.";
    notifyBtn.textContent = "Re-subscribe";
    say("Notifications enabled — you should get a test one now.", "ok");
  } catch (err) {
    say(err.message || String(err), "err");
  } finally {
    notifyBtn.disabled = false;
  }
});
</script>
{{ end }}
